name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name: { required: true }
      app_url: { required: true }
      package_name: { required: true }
      permissions: { required: true }
      icon_base64: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Config
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          PKG: ${{ inputs.package_name }}
          PERMS: ${{ inputs.permissions }}
          ICON: ${{ inputs.icon_base64 }}
        run: bash scripts/inject.sh

      - name: Build APK
        run: |
          cd apk-builder
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SAFE=$(echo "${{ inputs.app_name }}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          mkdir -p out
          cp apk-builder/app/build/outputs/apk/debug/app-debug.apk "out/${SAFE}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 3
